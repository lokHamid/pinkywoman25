spring.application.name=mainbackend
# driver of course wont work without this: and the config in pom.xml
spring.datasource.driver-class-name=org.postgresql.Driver
# DEBUGGING LOGGING (dev only)
# Show full stack traces in error responses
spring.web.error.include-stacktrace=always

# Force detailed logging for errors
logging.level.org.springframework=ERROR
logging.level.org.hibernate=ERROR
logging.level.root=INFO

# Most important: Show SQL + bound parameters + exceptions
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.hibernate.orm.jdbc.extract=TRACE

# Log full exceptions from web layer
logging.level.org.springframework.web=DEBUG

# ===============================
# DATABASE CONFIGURATION
# ===============================

# PostgreSQL Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/pw25
spring.datasource.username=bouchra_db_owner_pw25
spring.datasource.password=bouchra12345678901234567

# JWT Setup: // CHANGE TO ENV VAR LATER:
jwt.secret=73d19af6b0fef42dc9ef847c7a1a5dc32a62d3b2ec085261fb847bc91cb1e9a4
jwt.expiration=3600000

# Connection Pool Settings (HikariCP)
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# Show SQL in logs (disable in production)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Hibernate specific properties
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

