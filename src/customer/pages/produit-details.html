<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinky Woman 25 - Product Details</title>
    <link rel="stylesheet" href="/src/shared/styles/global.css">
    <link rel="stylesheet" href="../styling/produit-details.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="/src/shared/js/globalScript.js" defer></script>
    <script type="module" src="../scripts/produit-details.js" defer></script>
</head>
<body>

    <div class="main-content">
        <!-- Image Section -->
        <div class="image-side">
            <img id="currentImage" alt="Product Image">
            <div class="btns-holder">
                <button class="swap-img-btn" id="leftBtn" aria-label="Previous image">
                    <i class="fa-solid fa-angle-left"></i>
                </button>
                <button class="swap-img-btn" id="rightBtn" aria-label="Next image">
                    <i class="fa-solid fa-angle-right"></i>
                </button>
            </div>
            <div class="thumbnail-container">
                <!-- Thumbnails will be dynamically added here -->
            </div>
        </div>
        
        <!-- Information Section -->
        <div class="info-side">
            <div class="title-sect">
                <h1 class="title"></h1>
                <p class="price"></p>
                <p class="qt">quantité restante: </p>
                <p class="description"></p>
            </div>

            <hr class="divider-hr">

            <div class="category-sect">
                <h4>Catégorie</h4>
                <div class="category-cards-container">
                </div>
            </div>        

            <hr class="divider-hr">

            <div class="variant-sect">
                <h4>Choisir une variante</h4>
                <div class="variant-options">
                    <!-- Will be filled dynamically -->
                </div>
            </div>

            <div class="quantity-sect">
                <p>Quantité: </p>
                <input type="number" min="1" max="1000" value="1">
            </div>

            <hr class="divider-hr">

            <!-- Action Buttons -->
            <div class="action-buttons">
                <button class="btn-primary">
                    <i class="fa-solid fa-dollar-sign"></i>
                    Commander Maintenant
                </button>
            </div>
        </div>
    </div>
    <!-- Lightbox Modal -->
    <div id="lightboxModal" class="lightbox-modal">
        <button class="lightbox-close" id="lightboxClose">
            <i class="fa-solid fa-times"></i>
        </button>
        
        <div class="lightbox-nav">
            <button class="lightbox-nav-btn" id="lightboxPrev">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
            <button class="lightbox-nav-btn" id="lightboxNext">
                <i class="fa-solid fa-chevron-right"></i>
            </button>
        </div>
        
        <div class="lightbox-content">
            <img id="lightboxImage" class="lightbox-img" src="" alt="Full size product image">
            <div class="lightbox-caption">
                <span id="lightboxCaption">Product Image</span>
                <span id="lightboxCounter" style="margin-left: 10px; opacity: 0.7;"></span>
            </div>
        </div>
    </div>
    <script type="module" src="/src/shared/js/navbar-categories.js" defer></script>
</body>
</html>
