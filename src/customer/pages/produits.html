<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinky Woman 25 - Tous Les Produits</title>
    <link rel="stylesheet" href="/src/shared/styles/global.css">
    <link rel="stylesheet" href="../styling/produits.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="/src/shared/js/globalScript.js" defer></script>
    <script type="module" src="../scripts/produitsScript.js" defer></script>
</head>
<body>
    <div class="main-content">
        <div class="filter-sidebar">
            <div class="category-section">
                <h3>Categories</h3>
                <div class="filter-options">
                    <div class="filter-option">
                        <input type="checkbox" id="category-1">
                        <label for="category-1">T-Shirts</label>
                    </div>
                    <div class="filter-option">
                        <input type="checkbox" id="category-2">
                        <label for="category-2">Jeans</label>
                    </div>
                    <div class="filter-option">
                        <input type="checkbox" id="category-3">
                        <label for="category-3">Dresses</label>
                    </div>
                    <div class="filter-option">
                        <input type="checkbox" id="category-4">
                        <label for="category-4">Jackets</label>
                    </div>
                </div>
            </div>
            
            <div class="size-section">
                <h3>Taille</h3>
                <div class="size-options">
                    <div class="size-option">XS</div>
                    <div class="size-option">S</div>
                    <div class="size-option">M</div>
                    <div class="size-option">L</div>
                    <div class="size-option">XL</div>
                </div>
            </div>
            
            <div class="price-section">
                <h3>Gamme de prix</h3>
                <div class="price-inputs">
                    <div class="price-input-group">
                        <label for="price-min">Min (D.A)</label>
                        <input 
                            type="number" 
                            id="price-min" 
                            class="price-min-input"
                            placeholder="1000" 
                            min="0"
                        >
                    </div>
                    <div class="price-input-group">
                        <label for="price-max">Max (D.A)</label>
                        <input 
                            type="number" 
                            id="price-max" 
                            class="price-max-input"
                            placeholder="20000" 
                            min="0"
                        >
                    </div>
                </div>
            </div>
            
            <div class="color-section">
                <h3>Couleurs</h3>
                <div class="color-options">
                    <!-- Color options will be dynamically inserted here -->
                </div>
            </div>

            <button class="apply-filters-btn">appliquer</button>
            <button class="reset-filters-btn">réinitialiser</button>
        </div>
        <div class="products-wrapper">
            <div class="products-container">
                <div class="products-grid">
                    <!-- Products will be dynamically inserted here -->
                </div>
            </div>
        </div>
    </div>   
    <script type="module" src="/src/shared/js/navbar-categories.js" defer></script>
</body>
</html>
